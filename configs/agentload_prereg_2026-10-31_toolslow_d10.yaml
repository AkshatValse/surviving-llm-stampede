    together, so mu(300) in the 1800 s window is transient-biased: simulator +65%);
    the registered recovery threshold is lambda_miss'
- severity: warn
  code: n_cap_ambiguous
  message: 'n_cap=20: the runner-up n=20 is within 0.04048064783632819 (one run per
    n; mu(n) near its peak is bistable and transient-biased in the Stage-C window):
    the CAPPED arm''s cap is a noisy choice'
