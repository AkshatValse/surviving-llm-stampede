research_question: 'Pre-registration of the E2 kill-test predictions for SGLang FCFS,
  to be filled from the measured real-engine closed curve mu(n) (Stage C), the all-miss
  capacity lambda_miss and all-miss prefill-token rate (E0a) and the from-empty stability
  edge (E0b) BEFORE any E2 run: at which arrival rates lambda should a 200-session
  burst trap the engine, and where should the no-burst and capped arms stay good?'
assumptions_note: 'TEMPLATE: every `null` below is filled by `python -m analysis.prereg
  fill` (formulas, not typed numbers), except the lambda points, the margin and the
  sentence saying how they were chosen (lambda_selection), which are the lead''s decision.
  The filled file must be COMMITTED before the first E2 job is submitted. The E2 job
  script (`analysis.prereg check-job`) refuses to start unless the file is valid,
  committed and clean and the job''s label, lambdas, cap, reference rates, hardware
  and protocol are the registered ones, and writes the file''s sha256 into every run''s
  meta.json. `analysis.summarize burst2 --prereg FILE` calls a verdict decisive only
  for the registered cell (label == inputs.engine_cell_label exactly; ''fcfs'' substring
  matches such as vllm-fcfs or -native do not count) at a registered lambda inside
  the registered window, with every run bound to this file and started after its last
  commit. Theory behind the boundaries (notes/THEORY_prefix_meta.md; all rates in
  sessions/s): in a closed population of n sessions the engine completes mu(n) sessions/s.
  For OPEN arrivals at rate lambda the backlog drifts at lambda - mu(n), so n grows
  whenever mu(n) < lambda. If lambda < lambda_miss (= FCFS mu(infinity): everything
  misses at large n) the closed curve never falls below the arrival rate and any burst
  drains. If lambda_miss < lambda < max_n mu(n) the good state exists (n small, mu(n)
  > lambda) but a burst that pushes n past the point where mu(n) = lambda on the falling
  branch is not recoverable: the window of metastability. If lambda > max_n mu(n)
  there is no good state at all. Independently, E0b says up to which lambda the system
  STAYS in the good state when started from empty (finite horizon): above it the no-burst
  arm itself escapes spontaneously (simulator: from-empty edge 2.41 x lambda_miss,
  curve peak 4.07 x; 1/5 and 2/5 no-burst runs trapped at 2 x and 2.5 x within 65,000
  s). The window therefore ends at min(max_n mu(n), E0b''s largest all-stable multiple).
  The recovery threshold is lambda_miss, NOT mu(300): all n Stage-C sessions start
  at t=0, so mu(300) over the measured window is transient-biased (simulator +65%);
  it is kept under `checks` only. These are predictions from ONE run per n (noise
  ~5-10% in mu; mu is bistable near its peak); a lambda near a boundary tests the
  noise, not the theory, hence boundary_margin_rel.'
