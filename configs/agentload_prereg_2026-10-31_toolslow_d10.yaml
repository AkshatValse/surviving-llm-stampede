lambda_selection:
  rule: 'TOOLSLOW cell (remedy plan N3), label sglang-fcfs-r1-toolslow-d10: the E2
    NOBURST protocol (arm noburst only: the job glue sets arrivals.burst=null; the
    evaluation window is anchored to analysis_t_burst_s = 1200), seeds 0, 1, 2, 300k
    pool, OUTPUT_FEEDBACK=server, 8700-s runs. Protocol from configs/agentload_e2_toolslow_d10.yaml
    (a byte copy of configs/agentload_e2_burst.yaml plus the workload.tool_slowdown
    block and meta.notes): every tool call whose sleep STARTS in [1200, 2100) s sleeps
    its drawn tool time plus 10 s (client option workload.tool_slowdown {t_s: 1200,
    width_s: 900, add_s: 10}, logged per call in tool_calls.csv); tool calls starting
    after 2100 s are normal. The slowdown changes no random draw: plan.csv equals
    the committed E2 NOBURST run of the same seed at 1.35 x, its CRN control; the
    same-seed BURST run is reported beside it. DECISION RULE (cells d10 and d30 together,
    as registered): causal test of the gap: d10 GOOD in >=2/3 seeds and d30 STUCK
    in >=2/3 (of the registered seeds 0, 1, 2: 2 of 3 each). Reported as they are
    otherwise (d10 STUCK, d30 GOOD, or neither). Single point 1.35 x lambda_ref: the
    lower registered point (m1) of configs/agentload_prereg_2026-10-24.yaml, same
    inputs (prereg/inputs/2026-10-23: mu_curve, calibration, E0b bracket), same window
    (1, 2.0) x lambda_ref and the same 1/3-2/3 rule written on 2026-10-23 before E0b
    was read; reused unchanged so that each run pairs by seed (common random numbers)
    with the committed 300k E2 runs at 1.35 x (jobs 17093387-17093404 (results/nova/e2_170933xx_pulled_20261025-144558)).
    The measured values are those of cell sglang-fcfs-r1 (same hardware, pool, policy
    and refresh flag; filled by analysis.r14_prereg fill, which runs analysis.prereg.fill
    under sglang-fcfs-r1 with this cell''s E2 config and arm and then sets only inputs.engine_cell_label),
    so these runs stay out of the sglang-fcfs-r1 verdict. The cell''s E2 config is
    registered by its sha256 (protocol.e2_config_sha256; check-job refuses a job whose
    --e2-config bytes differ, and a run whose config.yaml differs is not bound) and
    the only authorised arm is protocol.arms. Hardware: a run on hardware other than
    ''NVIDIA A100 80GB PCIe, 81920 MiB'' is not bound (measured.hardware). FROZEN
    PRIMARY ENDPOINTS: STUCK and GOOD exactly as configs/r11_basin_predict.yaml defines
    them (its endpoints block, read by analysis/basin.py load_endpoints, unchanged),
    evaluated per run over [t_burst_s + eval_from_s, duration_s) = [5700, 8700) s
    with hit = pass_rule.hit_metric (a turn is a hit if cached_tokens / prompt_tokens
    > 0.5, attributed by completion time): STUCK := hit_eval < 0.2 (the registered
    constant burst.trap_hit_below); GOOD := trap_v2 RECOVERED (pass_rule recovered_*),
    or (hit_eval > 0.8 and backlog slope <= slope_frac x (lambda - lambda_miss), the
    registered trap_v2 slope threshold, lambda = 1.35 x lambda_ref). Statistics per
    seed (CRN pairs), no pooled intervals; ''>= 2/3'' means at least ceil(2/3 x the
    number of registered seeds) of the registered seeds; a seed without a completed,
    bound run counts against. Classification: python -m analysis.r14_cells classify
    (this file as --prereg). BLINDNESS: the theory session''s predictions for these
    cells (''pred2'', branch r13/pred2) are committed separately and pushed before
    the first job of these cells is submitted; this registration neither contains
    nor was written from them. The pass_rule and kill_conditions below are the template''s
    three-arm rule, inherited unchanged so the rule keys match the analysis; this
    one-arm cell is judged by the endpoints and the decision rule above (analysis/r14_cells.py),
    not by the paired PASS rule.'
  lambda_mults:
  - 1.35
  boundary_margin_rel: 0.1
  drain_fit_frac: 0.8
  seeds:
  - 0
  - 1
  - 2
  native_pool_lambda_mult: null
predictions:
  lambda_below_recovery_threshold:
    burst: 'not trapped: draining or recovered'
    noburst: good
    capped: recovered
  lambda_inside_window:
    burst: 'trapped: uncached prefill rate within +-rate_tolerance of E0a''s all-miss
      rate, backlog slope > slope_frac*(lambda-lambda_miss)'
    noburst: 'good through the run horizon (duration_s). HORIZON-DEPENDENT: the guarantee
      is E0b''s finite-horizon from-empty stability; the simulator shows noise-driven
      escapes (no-burst runs trapped) at 2 x and 2.5 x within 65,000 s, so a prediction
      of ''good'' only holds for the horizon E0b was run at (3000 s) and the 8700
      s runs here, and only below E0b''s edge'
    capped: recovered by the end of the run IF the gate queue drains in time (capped_drain);
      a cap at n_cap keeps the closed system on the rising branch of mu(n)
  lambda_above_window:
    burst: trapped
    noburst: 'may escape spontaneously (E0b edge) or has no good state (mu_max): NOT
      a prediction of ''good''; such lambdas are not registered'
    capped: NOT recovered (cap at n_cap serves at most mu_n_cap)
pass_rule:
  statement: 'PASS per lambda iff, in >= pass_fraction_min of the seeds (>= min_seeds
    seeds), the BURST arm is TRAPPED and the NOBURST arm is good and the CAPPED arm
    is RECOVERED. The kill test passes iff some registered lambda of the registered
    cell passes (decisive: see assumptions_note).'
  rate_estimator: uncached_tokens
  rate_tolerance: 0.15
  slope_frac: 0.5
  recovered_hit_above: 0.8
  recovered_backlog_below: 20.0
  recovered_backlog_metric: outstanding
  end_window_s: 300.0
  eval_from_s: 4500.0
  min_eval_s: 600.0
  slope_dt_s: 10.0
  pass_fraction_min: 0.6666666666666666
  min_seeds: 3
  hit_metric: frac_turns_cached_gt50
  cached_frac_threshold: 0.5
  attribute_by: complete
kill_conditions:
- 'the NOBURST arm is not good in >= 1/3 of the seeds at some REGISTERED lambda inside
  the window (whose upper edge is already capped by E0b''s from-empty stability edge:
  the good state does not exist there over this horizon)'
- the BURST arm is not trapped in >= 2/3 of the seeds at EVERY registered lambda (nothing
  traps)
- 'the CAPPED arm does not recover while the BURST arm traps AND the predicted gate
  drain time fits the run (capped_drain): the cap does not rescue, the mechanism is
  not session count'
- the window (lambda_miss, min(mu_max, E0b edge)) is empty or narrower than the noise
  of mu(n) and of E0b's bracket
checks:
  mu_300_is_a_check_only:
    value: 0.10777649390658053
    rel_dev_vs_lambda_miss: 0.5066466610723732
    note: all n sessions start at t=0; mu(300) over the measured window is transient-biased,
      so it does not set the window
