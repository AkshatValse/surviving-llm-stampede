    burst_n: 200.0
    mu_n_cap: 0.5916633082628089
    post_burst_available_s: 7200.0
    drain_fit_frac: 0.8
    max_drain_s: 5760.0
    max_lambda: 0.5569410860405867
    max_lambda_mult: 2.8726443273042217
    predicted_drain_s_by_mult:
