# PROPOSED simulator workload from real agent traces: SyFI TraceLab (Claude Code + Codex CLI sessions).
# Generated by scripts/traces/make_configs.py (repo commit 4d0d64b) from results/traces_summary/tracelab/summary.json and results/traces_norm/tracelab/*.csv. Not used by any run yet.
# Method, definitions and caveats: notes/lit/AGENT_TRACES.md.
# Tool-time series: per-turn idle interval (last tool result - last tool request of the model call), tool calls of all kinds except human-interaction tools (AskUserQuestion, ExitPlanMode, ...), wall clock as logged. Every law below is fitted to this series capped at 600 s.
#
# Field names are those of prefixmeta.workload.WorkloadParams on branch r7/robustness (commit 8c08883).
# `workload`                 tool_time_dist: lognormal    loads with the round-6 code and with 8c08883.
# `workload_bimodal`         tool_time_dist: bimodal      with the explicit tool_time_p_hi; needs 8c08883.
# `workload_empirical`       tool_time_dist: empirical    quantile table with explicit levels; needs 8c08883.
# `workload_empirical_idle_gap`  empirical table of the round_gap_next_nohuman|all series (see below); needs 8c08883.
# Each section is a complete `workload:` mapping; use one of them as the `workload` of a probe config or as workload_overrides.
#
# Token mapping: initial_context_tokens = mean first-call prompt of a session; new_prompt_tokens = mean tokens appended between two calls beyond the
# previous input+output (context compactions excluded, winsorised at p99.9); decode_tokens = mean output tokens per call (winsorised at p99.9).
# mean_turns = geometric parameter reproducing the observed mean calls per agentic episode (capped at max_turns = 60):
# observed mean 10.71 capped, median 5, p90 28, p99 116.
# NOTE the trace turn counts are not geometric (see AGENT_TRACES.md); this only matches the mean.
# CONTEXT SIZE: TraceLab sessions are long. The prompt of an average call is 171,576 tokens (median 132,092) and the first call of an agentic
# episode already carries 206,951 tokens on average (the conversation so far); initial_context_tokens below is the first call of a SESSION (23,308), so
# this section is indicative for tool times, tokens appended per call and turns, not for the context size (compare the 300k-token KV pool).
#
# Two-component lognormal mixture (no simulator counterpart, not a section): EM fit on the positive part (>= 0.01 s) of the capped series, KS 0.032;
# P(tool time < 0.01 s) = 0.05789; weights [0.4229, 0.5771], medians [0.06876, 2.257] s,
# sigma of log(seconds) [0.8482, 1.991].

workload:          # lognormal: mean fixed to the sample mean, CV chosen to minimise the KS distance
  initial_context_tokens: 23308
  new_prompt_tokens: 1251
  decode_tokens: 583
  mean_turns: 10.74
  max_turns: 60
  tool_time_mean_s: 8.475          # sample mean of the series capped at 600 s (uncapped mean 13.58 s)
  tool_time_dist: lognormal
  tool_time_cv: 22.91               # KS 0.075 at this mean
  # alternatives: MLE lognormal mean 8.538 s, CV 20.79 (KS 0.090); moment-matched CV 4.658 (KS 0.375)

workload_bimodal:          # two-point law with exactly the sample mean and CV; lo = sample median, hi and P(hi) solve mean and variance
  initial_context_tokens: 23308
  new_prompt_tokens: 1251
  decode_tokens: 583
  mean_turns: 10.74
  max_turns: 60
  tool_time_mean_s: 8.475          # = 8.475, the sample mean (unused by the sampler when tool_time_p_hi is given)
  tool_time_dist: bimodal
  tool_time_cv: 4.658              # = 4.658, the sample CV (unused by the sampler)
  tool_time_lo_s: 0.237
  tool_time_hi_s: 197.622
  tool_time_p_hi: 0.0417332
  # crude: two atoms. It carries the mean and the CV of the capped series (the quantities that set the idle-session count and the tail), not its shape.

