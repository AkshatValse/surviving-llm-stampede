lambda_selection:
  rule: 'TOOLSLOW cell T2 (r15), label sglang-fcfs-r1-toolslow-d15-165: the E2 NOBURST
    protocol (arm noburst only: the job glue sets arrivals.burst=null; the evaluation
    window is anchored to analysis_t_burst_s = 1200), seeds 0, 1, 2 (one seed per
    job), 300k pool, OUTPUT_FEEDBACK=server, 8700-s runs, 1.65 x lambda_ref. Protocol
    from configs/agentload_e2_toolslow_d15.yaml (a byte copy of configs/agentload_e2_toolslow_d30.yaml,
    the registered r14 d30 config, except the workload.tool_slowdown values, their
    comment lines and meta.notes): every tool call whose sleep STARTS in [1200, 2100)
    s sleeps its drawn tool time plus 15 s (client option workload.tool_slowdown {t_s:
    1200, width_s: 900, add_s: 15}, logged per call in tool_calls.csv); tool calls
    starting at or after 2100 s are normal. The d30 window at half the delay, run
    at 1.65 x instead of 1.35 x. The slowdown changes no random draw: plan.csv equals
    the committed E2 NOBURST run of the same seed at 1.65 x, its CRN control; the
    same-seed BURST run at 1.65 x is reported beside it. HOW THE CELLS WERE CHOSEN
    (not blind to earlier outcomes): T1 and T2 were chosen on 2026-11-05 after the
    registered r14 d30 cell (configs/agentload_prereg_2026-10-31_toolslow_d30.yaml,
    jobs 17169905-17169907 (results/nova/toolslow_shed_1716990x_pulled_20261101-154800):
    30 s added to tool calls starting in [1200, 2100) s at 1.35 x) trapped 1 of its
    3 seeds (STUCK in seed 2 only, GOOD in seeds 0 and 1, so its registered rule failed),
    and after reading simulator outputs (the calibrated simulator with a tool-slowdown
    hook written after the d10 / d30 results were known, run on the exact client plans
    and on random seeds). Every model we have (the calibrated simulator and the fluid
    model pred2) predicts that T1 TRAPS, so T1 is a reliability test of the trigger
    (does a tool-side slowdown with no added sessions trap the engine in at least
    2 of 3 seeds?), not a test between models. T2 is the model-discrimination cell:
    pred2''s fluid verdict (one plan-averaged call applied to every seed) and the
    simulator''s exact-plan runs predict different outcomes for some of its seeds,
    so T2 discriminates pred2 vs the simulator per seed. The models'' per-seed predictions
    are not part of this file: they are frozen in their own committed files (which
    also fix how each model output, including pred2''s per-seed layer, is scored),
    pushed before the first job of these cells is submitted; the TRAPS / NO-TRAP /
    MIXED call below depends on neither model. DECISION RULE: T2 (sglang-fcfs-r1-toolslow-d15-165)
    is decided alone, with no conjunction with any other cell: TRAPS iff STUCK in
    >= 2 of the 3 registered seeds; NO-TRAP iff GOOD in >= 2 of 3; else MIXED (a cell
    that meets both counts, possible only through runs that are both STUCK and GOOD,
    is MIXED). The other r15 cell, sglang-fcfs-r1-toolslow-d30w1800, is decided by
    its own registration. Single point 1.65 x lambda_ref: the upper registered point
    (m2) of configs/agentload_prereg_2026-10-24.yaml, same inputs (prereg/inputs/2026-10-23:
    mu_curve, calibration, E0b bracket), same window (1, 2.0) x lambda_ref and the
    same 1/3-2/3 rule written on 2026-10-23 before E0b was read; reused unchanged
    so that each run pairs by seed (common random numbers) with the committed 300k
    E2 NOBURST run at 1.65 x (jobs 17093387-17093404 (results/nova/e2_170933xx_pulled_20261025-144558)).
    The measured values are those of cell sglang-fcfs-r1 (same hardware, pool, policy
    and refresh flag; filled by analysis.r15_prereg fill, which runs analysis.prereg.fill
    under sglang-fcfs-r1 with this cell''s E2 config, arm and rate and then sets only
    inputs.engine_cell_label), so these runs stay out of the sglang-fcfs-r1 verdict.
    The cell''s E2 config is registered by its sha256 (protocol.e2_config_sha256;
    check-job refuses a job whose --e2-config bytes differ, and a run whose config.yaml
    differs is not bound), the only authorised arm is protocol.arms and the only authorised
    rate is lambda_selection.lambda_mults = [1.65]. Hardware: a run on hardware other
    than ''NVIDIA A100 80GB PCIe, 81920 MiB'' is not bound (measured.hardware). FROZEN
    PRIMARY ENDPOINTS: STUCK and GOOD exactly as configs/r11_basin_predict.yaml defines
    them (its endpoints block, read by analysis/basin.py load_endpoints, unchanged),
    evaluated per run over [t_burst_s + eval_from_s, duration_s) = [5700, 8700) s
    with hit = pass_rule.hit_metric (a turn is a hit if cached_tokens / prompt_tokens
    > 0.5, attributed by completion time): STUCK := hit_eval < 0.2 (the registered
    constant burst.trap_hit_below); GOOD := trap_v2 RECOVERED (pass_rule recovered_*),
    or (hit_eval > 0.8 and backlog slope <= slope_frac x (lambda - lambda_miss), the
    registered trap_v2 slope threshold, lambda = the run''s resolved rate, 1.65 x
    lambda_ref). A run counts only if it completed, is bound to this file, ran arm
    noburst at 1.65 x on a registered seed, its plan.csv equals the same-seed control''s
    (same columns and rows; sid, origin, idx and n_turns exactly, arrival_s and tool_time_total_s
    within 1e-9 s), and the manipulation happened (checked from the run''s own files,
    stricter than r14): meta.tool_slowdown is this cell''s block; its tool_calls.csv
    is complete (its row count and its count of slowed calls equal meta.outcome.tool_slowdown)
    and logs at least one tool call starting in [1200, 2100) s; every call starting
    in that window has add_s = 15; no call starting outside it has add_s != 0; and
    every call has t_ready = t_start + tool_s + add_s. Statistics per seed (CRN pairs),
    no pooled intervals; a seed without a counted run counts against both TRAPS and
    NO-TRAP; two counted runs of one seed leave the cell undecided until a human resolves
    it. Classification: python -m analysis.r15_cells classify (this file as --prereg).
    The pass_rule and kill_conditions below are the template''s three-arm rule, inherited
    unchanged so the rule keys match the analysis; this one-arm cell is judged by
    the endpoints and the decision rule above (analysis/r15_cells.py), not by the
    paired PASS rule.'
  lambda_mults:
  - 1.65
  boundary_margin_rel: 0.1
  drain_fit_frac: 0.8
  seeds:
  - 0
  - 1
  - 2
  native_pool_lambda_mult: null
predictions:
  lambda_below_recovery_threshold:
    burst: 'not trapped: draining or recovered'
    noburst: good
    capped: recovered
  lambda_inside_window:
    burst: 'trapped: uncached prefill rate within +-rate_tolerance of E0a''s all-miss
      rate, backlog slope > slope_frac*(lambda-lambda_miss)'
    noburst: 'good through the run horizon (duration_s). HORIZON-DEPENDENT: the guarantee
      is E0b''s finite-horizon from-empty stability; the simulator shows noise-driven
      escapes (no-burst runs trapped) at 2 x and 2.5 x within 65,000 s, so a prediction
      of ''good'' only holds for the horizon E0b was run at (3000 s) and the 8700
      s runs here, and only below E0b''s edge'
    capped: recovered by the end of the run IF the gate queue drains in time (capped_drain);
      a cap at n_cap keeps the closed system on the rising branch of mu(n)
  lambda_above_window:
    burst: trapped
    noburst: 'may escape spontaneously (E0b edge) or has no good state (mu_max): NOT
      a prediction of ''good''; such lambdas are not registered'
    capped: NOT recovered (cap at n_cap serves at most mu_n_cap)
pass_rule:
  statement: 'PASS per lambda iff, in >= pass_fraction_min of the seeds (>= min_seeds
    seeds), the BURST arm is TRAPPED and the NOBURST arm is good and the CAPPED arm
    is RECOVERED. The kill test passes iff some registered lambda of the registered
    cell passes (decisive: see assumptions_note).'
  rate_estimator: uncached_tokens
  rate_tolerance: 0.15
  slope_frac: 0.5
  recovered_hit_above: 0.8
  recovered_backlog_below: 20.0
  recovered_backlog_metric: outstanding
  end_window_s: 300.0
  eval_from_s: 4500.0
  min_eval_s: 600.0
  slope_dt_s: 10.0
  pass_fraction_min: 0.6666666666666666
  min_seeds: 3
  hit_metric: frac_turns_cached_gt50
  cached_frac_threshold: 0.5
  attribute_by: complete
kill_conditions:
- 'the NOBURST arm is not good in >= 1/3 of the seeds at some REGISTERED lambda inside
  the window (whose upper edge is already capped by E0b''s from-empty stability edge:
  the good state does not exist there over this horizon)'
- the BURST arm is not trapped in >= 2/3 of the seeds at EVERY registered lambda (nothing
  traps)
- 'the CAPPED arm does not recover while the BURST arm traps AND the predicted gate
  drain time fits the run (capped_drain): the cap does not rescue, the mechanism is
  not session count'
- the window (lambda_miss, min(mu_max, E0b edge)) is empty or narrower than the noise
  of mu(n) and of E0b's bracket
