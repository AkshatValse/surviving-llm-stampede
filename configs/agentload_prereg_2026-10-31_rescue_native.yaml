lambda_selection:
  rule: 'Rate point 4.0 x lambda_ref: the upper registered point (m2) of configs/agentload_prereg_2026-10-25_native.yaml,
    same inputs (prereg/inputs/2026-10-25-native), same window (1, 5.5) x lambda_ref
    and the same 1/3-2/3 rule written before native E0b was read; cap n_cap = 64 by
    smallest_within_margin; measured values of cell sglang-fcfs-r1-native (filled
    by analysis.rescue_prereg fill under that label, then only inputs.engine_cell_label
    set). RESCUE cell at the native 955,757-token pool (plan R4), KV_TOKENS=native,
    arm rescue only, seeds 0, 1, 2, the E2 burst of 200 at [1200, 1260), 8700-s runs.
    Gate (protocol.gate, from configs/agentload_e2_rescue_native.yaml): as R1 with
    n_cap = 64 and t_on_s = 2100. ENGAGE TIME: plan R4 said 2400; the lead moved it
    to 2100 after the 2400-s bundle-3 prediction (13/20 RESCUED mixed, below the plan''s
    7/10 rethink threshold) was seen and before any real rescue run; VALID is therefore
    FU-hit < 0.2 over [1800, 2100) and more than 50 outstanding at 2100 s. REGISTERED
    PER-RUN RULE (FU-hit = share of completed turns >= 2, attributed by completion
    time, with cached/prompt > 0.5): (a) VALID: FU-hit < 0.2 over [t_on - 300, t_on)
    AND more than 50 outstanding at t_on (outstanding = requests in flight + sessions
    waiting at the gate + paused sessions); a run whose meta.hardware differs from
    the registered hardware string (''NVIDIA A100 80GB PCIe, 81920 MiB'': all three
    nova22-gpu nodes report it and the sbatch header excludes nova22-amp-7) is INVALID;
    an undefined VALID window is INVALID; INVALID counts against PASS. (b) RELEASED
    with t_rel <= 7200 s (first release gate event). (c) POST-GOOD over [t_rel + 300,
    8700): every 300-s window (tiling from the start; a short remainder is covered
    by the window ending at 8700) has FU-hit >= 0.5, the whole interval has FU-hit
    > 0.8, the uncached-token rate is < 0.5 x the all-miss reference, and the registered
    trap_v2 RECOVERED predicate holds over the last 300 s; a window with no completed
    follow-up turn fails (c) but is not a RELAPSE. RESCUED = a and b and c. RELAPSE
    = any such window with FU-hit < 0.2. STUCK (same-seed committed BURST control)
    := FU-hit over [t_on, 8700) < 0.2 AND trap_v2 RECOVERED false over the last 300
    s. CHANGED CONSTANTS ACCEPTED BY THE LEAD BEFORE THIS TAG (after the bundle-3
    review, before any rescue run): REFUTED takes precedence over PASS (a cell that
    also meets PASS is listed, the verdict is REFUTED); the no-shed part of a PASS
    claim is withheld if any counted run has failed sessions (a failed session also
    leaves the gate, which is shedding); R4 requires stuck same-seed BURST controls
    like R1; the check-run tolerances CHECK (up to 3 sessions spawned in the last
    instant and never started, release on the t_on + k*release_check_s grid within
    2 s, the hold within 2 s, asyncio timers up to 0.05 s early, engage within 10
    s of t_on). Pairing: common random numbers with the committed BURST / NOBURST
    runs of the same seed and rate (BURST plan.csv sha256 equal; NOBURST plan = rescue
    plan minus the burst sessions), equal resolved rate, references, hardware and
    burst time; a cell with pairing or protocol problems does not count. Blinding:
    no requests.csv of a rescue run is read before all cells of a rate end; the job
    runs only the mechanical analysis.rescue check-run (no hit fractions). The verdict
    is python -m analysis.rescue verdict with this file as --prereg and the bundle-3
    predictions as --predictions. The pass_rule and kill_conditions below are the
    template''s three-arm rule, inherited unchanged so the rule keys match the analysis;
    this one-arm cell is judged by the rule above, not by the paired PASS rule. DECISION:
    PASS iff >= 2 of the 3 registered seeds are RESCUED and every same-seed committed
    native BURST control is STUCK; >= 2 of 3 RELAPSE refutes persistence at the native
    pool; INVALID runs count against PASS; a missing seed counts against PASS. Prediction
    of record (tag r11-rescue-pred, results/r11_predict_rescue/20261030-195231, cell
    R4s_t2100): RESCUED 16/20 (mixed) and 18/20 (separate), exact seeds 0-2 RESCUED,
    PASS. FROZEN CONSTANTS (analysis/rescue.py at this tag, by value): RULE={"fu_cached_frac_threshold":
    0.5, "post_interval_fu_hit_above": 0.8, "post_start_after_release_s": 300.0, "post_uncached_rate_frac_below":
    0.5, "post_window_fu_hit_min": 0.5, "post_window_s": 300.0, "relapse_fu_hit_below":
    0.2, "release_by_s": 7200.0, "valid_fu_hit_below": 0.2, "valid_outstanding_above":
