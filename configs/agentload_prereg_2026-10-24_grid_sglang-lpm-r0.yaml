research_question: 'Pre-registration of the E2 kill-test predictions for SGLang FCFS,
  to be filled from the measured real-engine closed curve mu(n) (Stage C), the all-miss
  capacity lambda_miss and all-miss prefill-token rate (E0a) and the from-empty stability
  edge (E0b) BEFORE any E2 run: at which arrival rates lambda should a 200-session
  burst trap the engine, and where should the no-burst and capped arms stay good?'
assumptions_note: EXPLORATORY only; never a decisive kill test. The parent's measurements,
  predictions, window and lambda multiples are inherited, not measured for this engine
  cell. Only the allowed arms may run; any calibration override supplies this cell's
  reference rates, without rescaling or re-measuring the inherited window.
status: EXPLORATORY
