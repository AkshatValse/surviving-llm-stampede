research_question: "When an LLM agent pauses for a tool call, how much end-to-end latency is lost by holding vs. swapping vs. discarding its KV cache, and how close do distribution-based (Continuum-style TTL) and prediction-free (ski-rental) retention policies get to an offline oracle?"

# NOTE: all cost numbers below are rough A100-class ASSUMPTIONS, not measurements.
server:
  M_tokens: 400000          # KV capacity (tokens); ~order of one 80GB GPU, 8B model
  prefill_s_per_token: 0.0001    # p: 10k tok/s
  decode_s_per_token: 0.025      # d: per request, assumed load-independent (batching)
  swap_s_per_token: 0.00002      # s: each direction, single FIFO PCIe channel
  max_context: 100000       # programs stop adding steps beyond this context

sim:
  horizon_s: 7200
  warmup_s: 600
  margin_s: 600             # latency measured on programs arriving in [warmup, horizon-margin]
  tool_time_scale: 1.0      # 0 => zero tool latency (used by tests)

workload:
  mean_steps: 8             # K ~ geometric(1/mean_steps), support >=1
  max_steps: 60
  L0:   {median: 2000, sigma: 0.8, min: 16, max: 32000}
  new:  {median: 500,  sigma: 1.0, min: 1,  max: 20000}
  dec:  {median: 150,  sigma: 0.7, min: 1,  max: 4000}
  tool_cap_s: 1800          # truncation of Pareto tail
  tools:
    fast:      {kind: lognormal, median: 0.3, sigma: 0.5}
    code_exec: {kind: lognormal, median: 3.0, sigma: 1.0}
    web:       {kind: lognormal, median: 2.0, sigma: 0.8}
    human:     {kind: pareto, xm: 10.0, alpha: 1.3}
  mixes:
    default: {fast: 0.35, code_exec: 0.30, web: 0.33, human: 0.02}
    heavy:   {fast: 0.27, code_exec: 0.27, web: 0.36, human: 0.10}
  # shift: programs arriving before shift_frac*horizon use `default`, after use `heavy`
  shift_frac: 0.5

policy:
  etas: [1.0, 4.0, 16.0]    # rent proxy: rent_rate = eta * L / M  (seconds of latency per second held)
  continuum_warmup_obs: 200 # per tool type; HOLD until this many observations
  continuum_refresh_every: 25
  continuum_grid: 256

experiment:
  mixes: [default, heavy, shift]
  # arrival rates (programs/s) from calibration: ALWAYS_HOLD util ~0.26/0.41/0.52/0.85(collapse onset)/0.95(overloaded), default mix
  arrival_rates: [0.15, 0.25, 0.32, 0.35, 0.40]
  seeds: [0, 1, 2, 3, 4]
  policies: [ALWAYS_HOLD, ALWAYS_SWAP, ALWAYS_DISCARD, CONTINUUM_TTL, SKI_DET, SKI_RAND, ORACLE_STATIC]
  calibration_rates: [0.26, 0.28, 0.30, 0.31, 0.32, 0.33, 0.34, 0.35]
  output_dir: results/kvrent_pilot
  hardware: "Apple M3 Max CPU (simulation)"
