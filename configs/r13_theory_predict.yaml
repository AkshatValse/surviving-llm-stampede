# R1/R4 result was read by the theory authors.  Machine-readable; the prose, blindness scope and scoring rules are in
# notes/PREDICTIONS_r13_theory.md and notes/THEORY_r13_scoring.md (rules also in analysis/theory/merged/scoring.yaml).
# Generated from results/theory/merged/*.json by analysis/theory/merged/freeze_table.py; the JSONs are the full record.
model: r13-merged-2 (B's fluid mean-field model + grafts; notes/THEORY_r13_merged.md)
reproduce:
  env: Windows Git Bash; python = "C:/Users/Akshat/Desktop/Claude Code/.venvs/nova-research/Scripts/python.exe"; PYTHONPATH="src;."
  predictions: python -m analysis.theory.predict analysis/theory/cells/{h200_300k,h200_300k_ratiofit,h200_300k_lamratiofit,h200_300k_decode2,h200_300k_e0a2,llama31_8b_300k,a100_pool150k,a100_pool600k,b1_basin_300k,r1_rescue_300k,r4_rescue_native}.yaml
  llama_speed_table: python -m analysis.theory.merged.speed_table analysis/theory/cells/llama31_8b_300k.yaml
  validation: python -m analysis.theory.validate --reuse  (after predicting a100_300k, a100_native, vllm_300k)
  this_file: python -m analysis.theory.merged.freeze_table
  deterministic: true
inputs:
  common:
    workload: 'configs/agentload_e2_burst.yaml workload section: L0 2000, Delta 550, d 100, T ~ min(Geom(1/15), 60), Exp(5 s) tool times; x_hit 551 (SGLang)'
    costs: 'calibration/round6_server_log_fit/calibration.yaml (SGLang A100 server-log iteration timing only): a 9.24 ms, f 1.26 ms, b 62.6 us, c_d 0.31
      ms, c_p 2.24 ns, chunk 8192'
    measured_mu_curve_used: false
    e0b_or_e2_outcome_used: false
  h200:
    pool_tokens: 300000
    e0a_lambda_miss_turns: 0.19388
    e0a_all_miss_tokens_per_s: 29866
    e0a_pop64_over_pop32: 1.046
    service_cost_assumption: 'PRIMARY: every A100 iteration cost divided by ONE uniform speed factor s fitted so the model''s E0a analogue (closed POP 32,
      cache off) equals 29,866 tok/s: s = 2.742. Bands: s fitted to the H200/A100 token ratio (2.703) or lambda ratio (2.761); decode/memory side 2.0 with
      compute fitted (decode2); two factors fitted to E0a tokens and the POP-64 ratio (e0a2). Known misfit: uniform scaling gives POP-64/POP-32 1.019 vs
      1.046 measured.'
  llama31_8b:
    pool_tokens: 300000
    gpu: A100 80GB PCIe
    e0a: unknown
    service_cost_assumption: 'architecture ratios on the Qwen2.5-7B costs (roofline): a, f x1.05 (weight bytes), b x1.06 (non-embedding params), c_d x2.286
      (layers x KV heads 32*8 / 28*4), c_p x1.306 (layers x query heads 32*32 / 28*28); lambda_ref = the model''s own lambda_miss 0.06186'
    conditional_rule: s = measured E0a tokens / 9,559; read every quantity off llama_speed_table by linear interpolation in s; windows and edges = mu /
      measured lambda_miss
  b1:
    cell: a100_300k
    multiple: 1.65
    lambda_ref: 0.071534
    bursts:
    - 100
    - 25
    burst_width_s: 60
    burst_t_s: 1200
    eval_window_s:
    - 5700
    - 8700
    stuck: hit < 0.2
    pass_rule: 100 STUCK in >= 2/3 seeds and 25 GOOD in >= 2/3
  r1:
    cell: a100_300k
    multiples:
    - 1.35
    - 1.65
    cap: 20
    t_on_s: 1800
    release: first 10 s tick >= t_on + 600 s with gate and resume deque empty 300 s
    release_by_s: 7200
    horizon_s: 8700
  r4:
    cell: a100_native (M = 955,757)
    multiple: 4.0
    cap: 64
    t_on_s: 2100
    release_by_s: 7200
    horizon_s: 8700
headline:
  h200: 'window 1.92 (F1; fluid 1.95; band 1.65-1.96), mu_max 0.372 sessions/s turns-based (F1), peak n 32.5 with hit ~0.69, n_half 37.3, n_b 41.3 (A100:
    32.7; cliff moves OUT), F2 edge 1.39 x (bracket [1.25, 1.5]; band 1.24-1.40), registration consequence hi 1.25, points 1.10/1.15, cap 32'
  llama31_8b: 'a priori: lambda_miss 0.0619, mu_max 0.208 (F1) at n 23, n_half 30.9, n_b 32.0 (pool part 27.76 speed- and model-invariant), window 3.37
    (F1), edge 2.46 x; conditional on the measured E0a via the speed table'
  pool150k: window 1.87 (F1) / 1.97 (fluid), n_b 18.3, n_half 16.9, F2 edge 1.09 x (no stable registered multiple)
  pool600k: window 5.47 (F1) / 5.72 (fluid), n_b 61.2, n_half 60.0, F2 edge 4.53 x (bracket [4.5, 5.0])
  b1: 'P(STUCK) per seed: burst 100 -> 1.000, burst 25 -> 0.042; P(PASS) = 0.995; N_crit deterministic 59.4 / 53.4 / 46.1 at 1.35 / 1.65 / 2.0 x (committor
    50%: 56 / 50 / 42)'
