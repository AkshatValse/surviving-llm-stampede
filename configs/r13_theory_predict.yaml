    rate >= 32% / 42% of the fluid value; a collapsed phase 1 misses 7,200 s'
  r4: 'RESCUED (fluid): release 5,040 s (F1 5,250), relapse ~0; least robust: needs phase-1 rate >= 51% of the fluid value; a collapsed phase 1 gives no
    release'
