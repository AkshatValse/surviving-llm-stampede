# PROPOSED simulator workload from real agent traces: mini-SWE-agent v2.0.0 on SWE-bench Verified (5 models, 100 paired instances each).
# Generated by scripts/traces/make_configs.py (repo commit 4d0d64b) from results/traces_summary/mini_swe_v2/summary.json and results/traces_norm/mini_swe_v2/*.csv. Not used by any run yet.
# Method, definitions and caveats: notes/lit/AGENT_TRACES.md.
# Tool-time series: per-step shell command wall time in the SWE-bench docker container (60 s harness timeout, censored). Every law below is fitted to this series capped at 600 s.
#
# Field names are those of prefixmeta.workload.WorkloadParams on branch r7/robustness (commit 8c08883).
# `workload`                 tool_time_dist: lognormal    loads with the round-6 code and with 8c08883.
# `workload_bimodal`         tool_time_dist: bimodal      with the explicit tool_time_p_hi; needs 8c08883.
# `workload_empirical`       tool_time_dist: empirical    quantile table with explicit levels; needs 8c08883.
# Each section is a complete `workload:` mapping; use one of them as the `workload` of a probe config or as workload_overrides.
#
# Token mapping: initial_context_tokens = mean first-call prompt of a session; new_prompt_tokens = mean tokens appended between two calls beyond the
# previous input+output (context compactions excluded, winsorised at p99.9); decode_tokens = mean output tokens per call (winsorised at p99.9).
# mean_turns = geometric parameter reproducing the observed mean calls per agentic episode (capped at max_turns = 60):
# observed mean 34.79 capped, median 32, p90 63, p99 104.
# NOTE the trace turn counts are not geometric (see AGENT_TRACES.md); this only matches the mean.
# CONTEXT SIZE: the prompt of an average call is 17,939 tokens (median 15,067); the context grows over the trajectory, first call 1,862 tokens.
#
# Two-component lognormal mixture (no simulator counterpart, not a section): EM fit on the positive part (>= 0.01 s) of the capped series, KS 0.058;
# P(tool time < 0.01 s) = 0; weights [0.4296, 0.5704], medians [0.05806, 0.4749] s,
# sigma of log(seconds) [0.2, 1.522].

workload:          # lognormal: mean fixed to the sample mean, CV chosen to minimise the KS distance
  initial_context_tokens: 1862
  new_prompt_tokens: 429
  decode_tokens: 269
  mean_turns: 49.02
  max_turns: 60
  tool_time_mean_s: 1.394          # sample mean of the series capped at 600 s (uncapped mean 1.394 s)
  tool_time_dist: lognormal
  tool_time_cv: 5.826               # KS 0.173 at this mean
  # alternatives: MLE lognormal mean 0.6453 s, CV 3.199 (KS 0.155); moment-matched CV 4.303 (KS 0.245)

workload_bimodal:          # two-point law with exactly the sample mean and CV; lo = sample median, hi and P(hi) solve mean and variance
  initial_context_tokens: 1862
  new_prompt_tokens: 429
  decode_tokens: 269
  mean_turns: 49.02
  max_turns: 60
  tool_time_mean_s: 1.394          # = 1.394, the sample mean (unused by the sampler when tool_time_p_hi is given)
  tool_time_dist: bimodal
  tool_time_cv: 4.303              # = 4.303, the sample CV (unused by the sampler)
  tool_time_lo_s: 0.104103
  tool_time_hi_s: 29.2801
  tool_time_p_hi: 0.0442064
  # crude: two atoms. It carries the mean and the CV of the capped series (the quantities that set the idle-session count and the tail), not its shape.

workload_empirical:          # empirical quantile table of the tool-time series
  initial_context_tokens: 1862
  new_prompt_tokens: 429
  decode_tokens: 269
  mean_turns: 49.02
  max_turns: 60
  tool_time_mean_s: 1.3982          # exact mean of the table (sample mean of the capped series 1.3939; uncapped 1.3939)
  tool_time_dist: empirical
  tool_time_cv: 4.292              # exact CV of the table (sample CV of the capped series 4.303)
  # no value of the series reaches the 600 s cap (maximum 60.082 s); values above 60 s hold 24% of the raw time;
  # table mean vs sample mean of the capped series: +0.31%, CV -0.24%.
