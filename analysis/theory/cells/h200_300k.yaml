# OUT-OF-SAMPLE (blind). H200 cell: same engine, model, workload and pool as a100_300k; one fitted parameter, a uniform
# speed factor fitted to the H200's own E0a all-miss token rate (an allowed input). No H200 Stage C / E0b / E2 result is used.
base: a100_300k.yaml
name: h200_300k
description: "SGLang 0.5.22 FCFS, Qwen2.5-7B-Instruct, 1x NVIDIA H200 NVL, KV pool 300,000 tokens (blind prediction)"
blind: true
costs:
  calibration: calibration/round6_server_log_fit/calibration.yaml
  fit_speed_to_e0a:
    tokens_per_s: 29866.0
    pop: 32
    source: "H200 E0a calibration (allowed input; task brief): all-miss 29,866 uncached tok/s (POP 32)"
lambda_ref:
  value: 0.19388
  source: "H200 E0a calibration (allowed input; task brief): lambda_miss_turns_based 0.19388 sessions/s"
stage_c:
  grid: [16, 20, 24, 28, 32, 40, 48, 96, 300]
  window_s: [900, 2700]
e0b:
  multiples: [1.25, 1.5, 1.75, 2.0, 2.5, 3.0]
  horizon_s: 3000
e2:
  multiples: auto             # the registered 1/3-2/3 rule applied to the model's own predicted window
  burst: {n: 200, t_s: 1200, width_s: 60}
  window_s: [5700, 8700]
  cap: auto                   # smallest Stage C grid n within 5% of the predicted (annealed) peak
