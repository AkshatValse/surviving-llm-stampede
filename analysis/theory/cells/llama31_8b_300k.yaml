# OUT-OF-SAMPLE (blind, a priori). Llama-3.1-8B-Instruct on the a100_300k engine/pool/workload. No data exist: the calibrated
# Qwen2.5-7B costs are multiplied by architecture ratios (roofline assumption); lambda_ref is the model's own lambda_miss.
base: a100_300k.yaml
name: llama31_8b_300k
description: "SGLang 0.5.22 FCFS, Llama-3.1-8B-Instruct, 1x A100 80GB PCIe, KV pool 300,000 tokens (a priori prediction)"
blind: true
