    input_throughput: (#new-token + replay tokens) / wall time since the previous Prefill line; both logged at result processing
      of every prefill batch (metrics_reporter.py report_prefill_stats). The interval includes any decode iterations and idle
      time since the previous prefill.
    gen_throughput: sum of decode-batch sizes over the last 40 decode batches / wall time since the previous Decode line (logged
      when forward_ct_decode % 40 == 0; prefill first tokens not counted). The interval includes prefill iterations run in
      between.
    decode_token: '#token = max_total_num_tokens - (available + evictable) = KV tokens pinned by running requests; verified:
      token usage == #token/300000 to rounding on all decode lines, and #token grows by exactly 40*R in 1144/1183 candidate
      windows.'
    cached_token: radix prefix of newly admitted requests; continuation chunks report 0 (add_chunked_req passes prefix_len=0),
      so continuation prefixes were reconstructed from chunk chains.
  selection:
    decode: 'consecutive Decode lines, no Prefill line between, equal #running-req R>0, #token growth == 40*R => tau = R /
      gen_throughput (exact).'
    prefill: 'previous batch line is a Prefill with #new-token == 8192 (budget exhausted => chunked request, whose continuation
      SGLang always schedules next); single-sequence batch with reconstructable prefix => tau = #new-token / input_throughput.'
