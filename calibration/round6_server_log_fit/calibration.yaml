  caveats:
  - SGLang runs prefill and decode as separate iterations and starves decode while any prefill batch can be formed ('Run prefill
    first if possible'); the simulator mixes them. With these values a simulator iteration with X prefill tokens and n_D decoders
    costs ~(iter_fixed+iter_floor - per_token*n_D) less than SGLang's P+D pair.
  - 'Decode per-sequence slope in SGLang is ~4.4e-5 s/seq; the shared per_token_s forces 6.3e-5 above R~20: +5..12% decode
    error at R>=80, -6% near R~32 (CUDA-graph bucket structure).'
  - Hit prefills (551 new tokens) have a higher per-pair attention cost (~3.8e-9 s) than 8192 chunks; the calibrated model
    is +17% (prefix<4k) .. -11% (prefix>16k) on them, ~0 near 10k.
  - 'Node-to-node spread (3 A100 nodes): per-job prefill per_token 6.1e-5..6.5e-5 s, decode intercept 9.0..10.5 ms.'
  - iteration times are wall-clock scheduler cycles (GPU forward plus non-overlapped CPU), which is what the simulator needs,
    not pure kernel time.
