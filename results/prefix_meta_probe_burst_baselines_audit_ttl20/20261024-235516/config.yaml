# Post-hoc source-audit sensitivities; not a new preregistration.
# Existing probe CLI recursively loads the round-3 mechanism config and its base.
# Original round-3 population, seeds, horizon and warm-up are retained for mu(300).
base_config: configs/prefix_meta_mech.yaml
parallel: {max_workers: 4}

policies:
  peek_order_audit: {kind: peek_singleton, protect_queued: rank}
  peek_score_audit: {kind: fcfs, protect_queued: rank_length}
  peek_singleton_audit: {kind: peek_singleton, protect_queued: rank_length}
  ttl5cw: {kind: continuum, ttl_pin_s: 5, ttl_unpin: continuum_waiting}
  ttl10cw: {kind: continuum, ttl_pin_s: 10, ttl_unpin: continuum_waiting}
  ttl20cw: {kind: continuum, ttl_pin_s: 20, ttl_unpin: continuum_waiting}
  ttl5cwr: {kind: continuum, ttl_pin_s: 5, ttl_unpin: continuum_waiting, ttl_refresh_lru_on_unpin: true}
  ttl10cwr: {kind: continuum, ttl_pin_s: 10, ttl_unpin: continuum_waiting, ttl_refresh_lru_on_unpin: true}
  ttl20cwr: {kind: continuum, ttl_pin_s: 20, ttl_unpin: continuum_waiting, ttl_refresh_lru_on_unpin: true}
  # CONCUR has no audited code switch: concur_cap (the round-3 row, inherited) already implements Eq. 1 with the paper's constants.
  # The rows below perturb only details the paper leaves unspecified (backend order, control interval, initial window); they are
  # labelled sensitivities, not corrected baselines.
  concur_lpm: {kind: lpm, session_cap: {aimd: {rule: concur, interval_s: 10.0, start: lb, min_cap: 4, u_low: 0.2, u_high: 0.5, h_thresh: 0.2, increase: 2, decrease: 0.5}}}
  concur_i5:  {kind: fcfs, session_cap: {aimd: {rule: concur, interval_s: 5.0, start: lb, min_cap: 4, u_low: 0.2, u_high: 0.5, h_thresh: 0.2, increase: 2, decrease: 0.5}}}
  concur_i20: {kind: fcfs, session_cap: {aimd: {rule: concur, interval_s: 20.0, start: lb, min_cap: 4, u_low: 0.2, u_high: 0.5, h_thresh: 0.2, increase: 2, decrease: 0.5}}}
  concur_s8:  {kind: fcfs, session_cap: {aimd: {rule: concur, interval_s: 10.0, start: 8, min_cap: 4, u_low: 0.2, u_high: 0.5, h_thresh: 0.2, increase: 2, decrease: 0.5}}}
  concur_s56: {kind: fcfs, session_cap: {aimd: {rule: concur, interval_s: 10.0, start: 56, min_cap: 4, u_low: 0.2, u_high: 0.5, h_thresh: 0.2, increase: 2, decrease: 0.5}}}

probe:
  curve:
    policies: [fcfs, lpm, peek, peek_rank, peek_order_audit, peek_score_audit, peek_singleton_audit,
               ttl5, ttl5cw, ttl5cwr, ttl10, ttl10e, ttl10ef, ttl10cw, ttl10cwr,
               ttl20, ttl20e, ttl20ef, ttl20cw, ttl20cwr,
               concur_cap, concur_lpm, concur_i5, concur_i20, concur_s8, concur_s56]
    n_grid: [300]
    seeds: [0, 1, 2]
    horizon_s: 30000.0
    warmup_s: 5000.0
    pool_sessions: 30000
    cache_enabled: true
  burst:
    # Invoke once per policy with --set probe.burst.policy=<name>.
    # Burst arm matches configs/prefix_meta_mech.yaml: original seeds and horizon.
    policy: peek_singleton_audit
    lambda_miss: 0.047418947368421054
    lam_mult: 2.0
    warmup_s: 5000.0
    after_s: 25000.0
    burst_n: 200
    burst_width_s: 60.0
    arms: {burst: {burst_n: 200}}
    seeds: [0, 1, 2, 3, 4]
    recovered_hit_above: 0.8
    recovered_backlog_below: 20.0
    hit_eval_from_s: 10000.0
    trap_hit_below: 0.2
    trap_min_s: 10000.0
