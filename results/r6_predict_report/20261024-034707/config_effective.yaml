research_question: 'Blind predictions of the calibrated simulator (mixed primary,
  separate_prefill_priority secondary) for: B1 the all-miss capacity of the Stage
  C workload, B2 the from-empty open-loop stability edge, B3 the E2 paired burst /
  cap test, B4 the closed-population curves with a 600k and 900k KV pool.'
base_config: configs/prefix_meta_r5.yaml
engine:
  iter_fixed_s: 0.00924
  iter_floor_s: 0.00126
  per_token_s: 6.26e-05
  decode_attn_s: 0.00031
  attn_ctx_norm: 8192
  prefill_attn_s: 2.24e-09
  prefill_attn_ctx: mid
  prefill_chunk_budget: 8192
  max_running_seqs: 256
  kv_memory_tokens: 300000
  cache_enabled: true
  skip_ahead: false
  admission_limited_by_prefill_budget: true
  batch_decode_iterations: true
  free_kv_on_session_end: true
  batching: mixed
workload:
  initial_context_tokens: 2000
  new_prompt_tokens: 550
  decode_tokens: 100
  mean_turns: 15
  max_turns: 60
  tool_time_mean_s: 5.0
  tool_time_dist: exp
  tool_time_cv: 1.5
metrics:
  window_s: 100.0
  fine_window_s: 100.0
  tail_window_s: 2500.0
parallel:
  max_workers: 6
probe:
  curve:
    policies:
    - fcfs_lru
    n_grid:
    - 32
    seeds:
    - 0
    - 1
    - 2
    warmup_s: 900.0
    horizon_s: 2700.0
    pool_sessions: 5000
    cache_enabled: false
  open:
    policy: fcfs_lru
    lambdas:
    - 0.07
    - 0.08
    - 0.09
    - 0.1
    - 0.11
    - 0.12
    - 0.13
    - 0.14
    - 0.15
    - 0.16
    - 0.18
    - 0.2
    - 0.22
    seeds:
    - 0
    - 1
    - 2
    horizon_s: 3000.0
    stable_final_backlog_below: 50.0
    stable_trend_window_s: 1500.0
    stable_trend_max_rise: 10.0
    unstable_backlog_stop: 3000
  burst:
    policy: fcfs_lru
    lambda: 0.1
    burst_n: 200
    burst_width_s: 60.0
    warmup_s: 1200.0
    after_s: 7500.0
    cap: 20
    seeds:
    - 0
    - 1
    - 2
    recovered_hit_above: 0.8
    recovered_backlog_below: 20.0
    hit_eval_from_s: 5000.0
    trap_hit_below: 0.2
    trap_min_s: 2500.0
predict:
  b1:
    reference_population: 32
    expected_turns: 14.761
  b2:
    edge_rule: 'predicted from-empty edge = the largest grid lambda such that EVERY
      grid lambda <= it is all-stable (3 of 3 seeds); also reported: the largest all-stable
      grid lambda irrespective of contiguity, and the 20-seed supplement''s stable
      fractions.'
  b3:
    lambda_miss: b1_turns_based
    eval_window_s:
    - 5000.0
    - 7500.0
    trapped_token_rate_rel_tol: 0.15
    trapped_slope_frac: 0.5
    recovered_hit_above: 0.8
    recovered_backlog_below: 20.0
    good_noburst: recovered
    pass_min_frac: 0.6666666666666666
    sensitivity_eval_windows_s:
    - - 6000.0
      - 7500.0
    - - 2500.0
      - 7500.0
