  prereg_sha256: 93a0cf5d47c0059a579b059484bc367e6c4371afa4bc07cb1ebe97130f6f21dc
  prereg_file: configs/agentload_prereg_2026-10-24_grid_sglang-lpm-r1.yaml
output:
