research_question: 'r16 MIRROR (real engine, paired arms): for a STEP-CAPPED agent
  workload (T = min(Geometric(1/1000), 20): about 98% of sessions run exactly 20 turns;
  every other constant equals configs/agentload_e2_burst.yaml), does the trapped engine
  behave as model F''s renewal law predicts -- a near-blackout of session completions
  for about 40 min after the burst, then a completion wave when the burst cohort finishes
  its 20th turn, then completions BELOW the all-miss capacity (the youth premium of
  Theorem 2 reversed by the turn-count factor H < 1) -- rather than as every throughput-curve
  reading predicts (steady completions near the all-miss capacity)? The registered
  rules and frozen predictions are in analysis/r16_mirror.py and notes/PREDICTIONS_r16_mirror.md.'
assumptions_note: 'This file is configs/agentload_e2_burst.yaml with exactly two values
  changed: workload.mean_turns 15 -> 1000 and workload.max_turns 60 -> 20 (and this
  text and meta.notes). Same engine, pool (300k), burst (200 sessions in [1200, 1260)
  s), 8700-s runs, lambda_ref (the registered E0a value of the STANDARD workload,
  used only to place the arrival rates as multiples) and paired arms as the E2 protocol:
  BURST = this config; NOBURST = arrivals.burst=null (same plan without the burst
  sessions). One arm per job, so every arm gets content_salt=1. The step-capped workload''s
  own all-miss capacity (model: 1.046 x lambda_ref) is measured separately by an E0a
  run of this workload (MODE=miss with GEN_EXTRA setting the same two values), which
  no rule uses for its thresholds.'
