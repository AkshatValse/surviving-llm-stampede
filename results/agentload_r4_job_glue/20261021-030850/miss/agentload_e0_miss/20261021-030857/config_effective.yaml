research_question: 'E0a (real engine): what is the all-miss capacity lambda_miss (sessions/s)
  of Qwen2.5-7B-Instruct on one A100-80GB under the simulator''s agent workload, with
  prefix caching DISABLED at the server (SGLang --disable-radix-cache / vLLM --no-enable-prefix-caching)?'
assumptions_note: 'Workload constants are the simulator''s (configs/prefix_meta.yaml
  on pilot/prefix-meta): L0=2000, Delta=550, d=100, geometric mean 15 turns (cap 60),
  Exp(5 s) tool times. Closed population (a completed session is replaced at once),
  as in the simulator''s lambda_miss measurement. Throughput is measured by analysis
  (miss subcommand) over [warmup_s, end]; the generator itself only logs. Max prompt
  = 2000 + 59*650 = 40350 tokens exceeds Qwen2.5''s default 32768 context: the engine
  must be launched with a longer context (see slurm/ and the plan, open issue O2).'
