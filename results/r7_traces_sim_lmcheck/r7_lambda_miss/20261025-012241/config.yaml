# Round 7, REAL-TRACE tool times in the calibrated simulator (referee objection 3: "your agent tool times are synthetic").
#
# Written and committed BEFORE any run that uses it (the git commit in every meta.json is that commit or a later one that did not change this file).
# Same stages, rules and seeds as step 2 of configs/r7_robustness.yaml (lambda_miss, closed curve, from-empty edge, paired NOBURST / BURST / CAPPED test);
# steps 3-5 of that spec (burst size, horizon, low lambda) are NOT part of this spec. Driver and analysis: src/prefixmeta/r7_robustness.py (stages
# lambda_miss, curves, edge, pairs) and src/prefixmeta/r7_report.py, unchanged in their rules; run with --out-root results/r7_traces_sim so that the
# manifest of the round-7 synthetic runs (results/r7_robustness/manifest.tsv) is not touched.
#
# Everything from `base_config:` to the `workloads:` of the r7 block, and every r7 block after it (lambda_miss, curve, edge, window, pairs, classify), is copied
# verbatim from configs/r7_robustness.yaml (checked by tests/test_r7_traces_sim.py): the engine block of configs/r6_predict.yaml (calibrated cost constants,
# KV pool 300000 tokens, batching `mixed`), the record workload geometry (first prompt 2000 tokens, +550 tool tokens, 100 decoded tokens, T ~ min(Geometric(1/15), 60))
# and all seeds, grids and rules. ONLY the tool-time law differs between the primary workloads below.
#
# Tool-time laws: the EMPIRICAL quantile tables (250 knots, strictly increasing levels 0..1, inverse CDF linear between knots, exact table moments) of the
# `workload_empirical` / `workload_empirical_idle_gap` blocks of the two trace configs, measured by branch r7/traces (notes/lit/AGENT_TRACES.md there) and copied
# byte for byte into this branch (commit ca165a0 here; source branch tip 1556630e864a7f54f6e20e3b00d17283f570dd0f):
#   configs/workload_trace_tracelab.yaml     sha256 c59c7fda33d146b9f1f9dbc8017f9c885b0a89d7fbe28661f7f60df4c2d476e0
#   configs/workload_trace_mini_swe_v2.yaml  sha256 cf0f43f6a7754ae55a8a12e089392bb4e7b86131164003a481ac1c8febfba459
# The tables are inlined here (a spec is self-contained in every result dir); tests/test_r7_traces_sim.py checks them value for value against the two files.
#   tl_turn    SyFI TraceLab (Claude Code + Codex CLI), per-turn tool interval (last tool result - last tool request of the model call), capped at 600 s: the headline
#              series of the trace study. Table mean 8.51 s, CV 4.65, median 0.237 s.
#   tl_idle    SyFI TraceLab, inter-request idle gap (tool time + output-to-request overhead + any human wait): an UPPER-BOUND sensitivity. Table mean 14.52 s, CV 3.53.
#   mini_tool  mini-SWE-agent v2.0.0 on SWE-bench Verified, per-step shell command time (60 s harness limit). Table mean 1.398 s, CV 4.29, median 0.104 s.
#   exp5       the record workload, Exp(5 s): a control re-run through the same code path (its numbers must be bit-identical to round 7).
# Secondary (declared here, run on the same stages): mini_full = the mini-SWE-agent workload with ITS OWN turns (mean_turns 49.02 capped at 60, E[T] 34.79), tokens per
# turn (+429 appended, 269 decoded) and first prompt (1862 tokens) from workload_trace_mini_swe_v2.yaml `workload_empirical`; its longest session ends at 43313 tokens
# (14% of the 300000-token KV pool; length-biased mean context 18.5k tokens), so it fits the testbed pool. The TraceLab FULL workload is NOT run: its prompts at an
# average call are 172k tokens (median 132k; 207k at the first call of an agentic run), so the 300k-token pool could not hold two such sessions and the mapped
# initial_context_tokens of its config (23308, the first call of a session) would not describe the traced workload; only its tool-time law is used (tl_turn, tl_idle).
#
# Declared reading rules (fixed before the runs, nothing is tuned afterwards):
#  * every verdict is the rule of configs/r7_robustness.yaml applied as written: hi = B2's contiguous all-stable rule on the grid (plus the declared refinement grid
#    if 1.25 x is not all-stable), test points lo + (hi - lo) * {1/3, 2/3} rounded to the nearest 0.05, PASS needs BURST trapped, NOBURST good and CAPPED recovered
#    in >= 7 of 10 seeds. A window with hi <= 1.1 is EMPTY, no paired test is run, and that is reported as the result.
#  * a FAIL, an empty window or a peak at the edge of the n grid (n = 8 or n = 300) is reported as it comes out; the grids, seeds, caps and rules are NOT changed
#    after the first run, for any workload, including mini_full (whose smaller pool capacity, N*_lb = 16 sessions against 28 for the record workload, may put its
#    closed-curve peak near the lower end of the grid).
#  * the exp5 control must reproduce the round-7 numbers of the record workload bit for bit (lambda_miss 0.072187 sessions/s turns-based, peak n 20, cap n 20,
#    window [1, 2.0], points 1.35 and 1.65); if it does not, the comparison with the synthetic laws is void and that is the first thing reported.
research_question: >-
  Do the simulator's metastability findings (lambda_miss, closed curve mu(n), from-empty stability edge, paired BURST / NOBURST / CAPPED kill test) survive when the
  synthetic Exp(5 s) tool time is replaced by the empirical tool-time laws measured on real agent traces (TraceLab Claude Code / Codex CLI sessions, mini-SWE-agent v2 on
  SWE-bench Verified), with everything else of the record workload unchanged?

base_config: configs/prefix_meta_r5.yaml        # r5 -> prefix_meta.yaml; fcfs_lru = FCFS with LRU eviction

engine:                                          # r6_predict.yaml `engine:` block, verbatim
  iter_fixed_s: 0.00924
  iter_floor_s: 0.00126
  per_token_s: 6.26e-05
  decode_attn_s: 0.00031
  attn_ctx_norm: 8192
  prefill_attn_s: 2.24e-09
  prefill_attn_ctx: mid
  prefill_chunk_budget: 8192
  max_running_seqs: 256
  kv_memory_tokens: 300000
  cache_enabled: true
  skip_ahead: false
  admission_limited_by_prefill_budget: true
  batch_decode_iterations: true
  free_kv_on_session_end: true
  batching: mixed

workload:                                        # the record workload (identical to configs/r6_predict.yaml `workload:`)
  initial_context_tokens: 2000
  new_prompt_tokens: 550
  decode_tokens: 100
  mean_turns: 15
  max_turns: 60
  tool_time_mean_s: 5.0
  tool_time_dist: exp
  tool_time_cv: 1.5            # unused for exp

metrics:
  window_s: 100.0              # 100 s windows tile every measurement window used below
  fine_window_s: 100.0
  tail_window_s: 2500.0        # only the `tail_*` summary columns of the runs (the last 2500 s); does not touch the dynamics

parallel:
  max_workers: 6               # hard cap (the task allows at most 6 worker processes)

# ------------------------------------------------------------------------------------------------------------------------------ r7 declarations
# (read by src/prefixmeta/r7_robustness.py; fixed before any run)
r7:
  policy: fcfs_lru
  expected_turns: 14.761       # E[min(Geom(1/15), 60)]; does not depend on the tool-time distribution (asserted by the driver)
  wilson_z: 1.96               # EVERY fraction in the report carries a Wilson 95% interval (runner.wilson_ci with this z)


  # ---- the tool-time workloads (workload overrides on top of `workload:` above). The four primary ones change ONLY the tool-time law.
  workloads:
