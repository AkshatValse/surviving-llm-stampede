research_question: 'In the prefix-cache serving simulator (src/prefixmeta), is the
  metastability of agentic multi-turn serving explained by the open-system fluid picture
  dn/dt = lambda - mu(n), where mu(n) is the closed-population "thrashing curve" (n
  sessions always present, each completed session immediately replaced by a fresh
  turn-1 session)? Concretely: does the measured FCFS-LRU curve have the predicted
  sharp peak near the length-biased working set N_lb and a tail at the all-miss rate;
  does the fluid fixed-point analysis predict the critical burst size, the recovery
  thresholds and the size-scaling of the from-empty stability limit; and does replacing
  LRU by an eviction rule that does not produce the cyclic-reference cliff (RANDOM,
  MRU_IDLE) widen the safe session-cap band?'
assumptions_note: Round 4 of the prefix-cache metastability pilot. Engine, workload
  and metric constants are inherited from `base_config` (ALL are assumptions, none
  a measurement). Predictions R1-R6, the registered grid / seeds / horizons and the
  exact decision readings are in `preregistration_file`, committed (db30e76) before
  any round-4 code or run; a test checks that the `curve`, `burst` and `cap` sections
  below equal the registered design. `*.quick` blocks are smoke-test sizes with their
  own seeds; they are never used for a prediction.
preregistration:
  date: 2026-10-21
  expected_verdict: REFRAME
  why: Memory-gated admission is work-conserving over misses, so under a long queue
    every freed token becomes a new reservation and idle KV is ~0; a session's KV
    is evicted during its tool call, before its next turn is queued. LPM then has
    almost no resident waiting requests to promote, so it cannot leave the congested
    state.
  predictions:
  - 'E1 (cold=300, lambda in {1.25,1.5,2}x lambda_miss): LPM and FCFS both recover
    0/3; LPM-128 == FCFS bit-identical (queue 300 > 128 on the first pass).'
  - 'E1 cold-size sweep: FCFS and LPM recovery counts are identical in every (cold,
    lambda) cell; small cold starts (<=~50) recover 3/3, large (>=~100) 0/3.'
  - 'E1 FCFS-CAP: with the spec N*=45 it does not recover; with the length-biased
    N*~28 (and caps <=27) it recovers 3/3. Admission control is the only recovering
    family.'
  - 'E2 (burst 200 at 2x): LPM hit rate over [t_b+10k, t_b+25k] is above 0.8 in <=1/5
    seeds; LPM-128 ~ FCFS trapped.'
  - 'E3 spec ramp (peak 0.9 lambda_cap): hysteresis area ~0 and FCFS == LPM; E3 above-cap
    ramp (peak 1.3 lambda_cap): area > 0 with FCFS ~ LPM.'
  - 'Decision rule: GO is unreachable; verdict REFRAME (not KILL, since LPM-128 is
    trapped in E2 by the spec''s hit<0.2 for >=10k s criterion).'
  not_claimed: 'That ''LPM-128 inherits the trap'' is a finding: with queues > 128
    at the first pass LPM-128 is FCFS by construction. lambda_cap is a finite-horizon
    stability (lifetime) boundary, not a memory-time capacity.'
