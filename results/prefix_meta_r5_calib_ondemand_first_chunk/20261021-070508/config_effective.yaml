research_question: Is prefix-cache metastability in agent serving an artifact of reserving
  each running request's full end-of-turn KV at admission, or does it persist under
  vLLM-like on-demand allocation with recompute preemption and SGLang-like new_token_ratio
  reservation with retraction?
assumptions_note: 'Round 5 of the prefix-cache metastability pilot (stage 3: amendment
  2 of the pre-registration). Engine, workload and metric constants are inherited
  from `base_config` (ALL are assumptions, none a measurement). The two new allocation
  modes are simulator models of the allocation / preemption rules a scout reported
  for vLLM v0.32.0 (ondemand_preempt) and SGLang v0.5.22 (ratio_reserve); the scout
  read the source through a summarising fetcher, so every rule and constant below
  is extractor-reported and unverified (see the `unconfirmed` block of the pre-registration).
  Predictions S1-S4, the registered grid / seeds / horizons and the exact decision
  readings are in `preregistration_file`, committed (e24e3cd) before any round-5 code
  or run (its amendment 1, 7ab10f4, before any round-5 experiment command; its amendment
  2 before any registered-size run); a test checks that the `calibration`, `curve`,
  `burst` and `cap` sections below equal the registered design (amendment 2 adds the
  two engine switches under `modes.engine_overrides`, the `thrash` block and the `variants`
  block). `*.quick` blocks are smoke-test sizes with their own seeds (7300-7310);
  they are never used for a prediction.'
preregistration:
  date: 2026-10-21
  expected_verdict: REFRAME
  why: Memory-gated admission is work-conserving over misses, so under a long queue
    every freed token becomes a new reservation and idle KV is ~0; a session's KV
    is evicted during its tool call, before its next turn is queued. LPM then has
    almost no resident waiting requests to promote, so it cannot leave the congested
    state.
  predictions:
  - 'E1 (cold=300, lambda in {1.25,1.5,2}x lambda_miss): LPM and FCFS both recover
    0/3; LPM-128 == FCFS bit-identical (queue 300 > 128 on the first pass).'
  - 'E1 cold-size sweep: FCFS and LPM recovery counts are identical in every (cold,
    lambda) cell; small cold starts (<=~50) recover 3/3, large (>=~100) 0/3.'
  - 'E1 FCFS-CAP: with the spec N*=45 it does not recover; with the length-biased
    N*~28 (and caps <=27) it recovers 3/3. Admission control is the only recovering
    family.'
  - 'E2 (burst 200 at 2x): LPM hit rate over [t_b+10k, t_b+25k] is above 0.8 in <=1/5
    seeds; LPM-128 ~ FCFS trapped.'
  - 'E3 spec ramp (peak 0.9 lambda_cap): hysteresis area ~0 and FCFS == LPM; E3 above-cap
    ramp (peak 1.3 lambda_cap): area > 0 with FCFS ~ LPM.'
  - 'Decision rule: GO is unreachable; verdict REFRAME (not KILL, since LPM-128 is
    trapped in E2 by the spec''s hit<0.2 for >=10k s criterion).'
  not_claimed: 'That ''LPM-128 inherits the trap'' is a finding: with queues > 128
    at the first pass LPM-128 is FCFS by construction. lambda_cap is a finite-horizon
    stability (lifetime) boundary, not a memory-time capacity.'
